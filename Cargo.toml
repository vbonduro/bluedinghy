[package]
name = "bluedinghy"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Provides an API to send and receive iMessage through blueferry"
license = "MIT"
repository = "https://github.com/vbonduro/bluedinghy"
keywords = ["iMessage", "blueferry", "dbus"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["time"] }
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "proxy"] }

[dev-dependencies]
anyhow = "1.0.104"
rustyline-async = "0.4.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "test-util"] }
